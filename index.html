<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123c67">
  <meta name="robots" content="noindex,nofollow">
  <title>Sistema de Registro LUF</title>
  <style>
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;font:15px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f8fc;color:#17395d}
    main{width:min(520px,100%);padding:32px;background:#fff;border:1px solid #d9e3ee;border-radius:16px;box-shadow:0 8px 32px #102b4612;text-align:center}
    h1{margin:0 0 12px;font-size:23px;color:#123c67}
    p{margin:0 0 22px;color:#526b86;line-height:1.55}
    a{display:inline-block;border-radius:9px;padding:12px 18px;background:#126de0;color:white;text-decoration:none;font-weight:750}
    a:focus-visible{outline:3px solid #123c67;outline-offset:3px}
    small{display:block;margin-top:16px;color:#72859b}
  </style>
</head>
<body>
  <main>
    <h1>Sistema de Registro LUF</h1>
    <p>Abriendo el sistema institucional seguro. Inicia sesión con tu cuenta <strong>@liceoluf.com</strong> cuando se solicite.</p>
    <a id="open-system" href="https://script.google.com/a/macros/liceoluf.com/s/AKfycby0Vm6PjJUbq153t5XpHgk5veq11GbOZcMTaD0TWdIgjWX0w48pO6T-3nHCE8e0IFaz/exec">Abrir sistema institucional</a>
    <small>Si el acceso automático no continúa, usa el botón.</small>
  </main>
  <script>
    const target=document.getElementById('open-system').href;
    window.location.replace(target);
  </script>
</body>
</html>
