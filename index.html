<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123c67">
  <meta name="robots" content="noindex,nofollow">
  <title>Sistema de Registro LUF</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{font:14px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f8fc;color:#17395d}
    .system-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f5f8fc}
    .loading{position:fixed;inset:0;z-index:2;display:grid;place-content:center;gap:14px;padding:24px;text-align:center;background:#f5f8fc}
    .loading[hidden]{display:none}
    .brand{font-weight:800;letter-spacing:.04em;color:#123c67}
    .message{max-width:460px;color:#526b86;line-height:1.55}
    .open{display:inline-block;justify-self:center;border-radius:9px;padding:11px 16px;background:#126de0;color:white;text-decoration:none;font-weight:700}
    .open:focus-visible{outline:3px solid #123c67;outline-offset:3px}
  </style>
</head>
<body>
  <iframe class="system-frame" id="system" title="Sistema institucional de Registro LUF"
    src="https://script.google.com/a/macros/liceoluf.com/s/AKfycby0Vm6PjJUbq153t5XpHgk5veq11GbOZcMTaD0TWdIgjWX0w48pO6T-3nHCE8e0IFaz/exec"
    referrerpolicy="no-referrer"></iframe>
  <main class="loading" id="loading" aria-live="polite">
    <div class="brand">SISTEMA DE REGISTRO LUF</div>
    <div class="message">Conectando con la aplicación institucional. Si se solicita, inicia sesión con tu cuenta <strong>@liceoluf.com</strong>.</div>
    <a class="open" href="https://script.google.com/a/macros/liceoluf.com/s/AKfycby0Vm6PjJUbq153t5XpHgk5veq11GbOZcMTaD0TWdIgjWX0w48pO6T-3nHCE8e0IFaz/exec" target="_blank" rel="noopener noreferrer">Abrir sistema institucional</a>
  </main>
  <script>
    const frame=document.getElementById('system');
    const loading=document.getElementById('loading');
    const timeout=setTimeout(()=>loading.hidden=true,8000);
    frame.addEventListener('load',()=>{clearTimeout(timeout);loading.hidden=true});
  </script>
</body>
</html>
